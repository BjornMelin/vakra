# Run configuration for capstone/run/run_cut.sh (B0 baseline, train split).
#
# This file is NON-SECRET and committed. Do not put API keys here: the local
# vLLM server accepts any key, so run_cut.sh defaults LITELLM_API_KEY/API_KEY to
# "dummy". Export real keys in your shell only if an endpoint needs them.
#
# Format: bash KEY=VALUE lines (sourced). Any value can be overridden from the
# environment, e.g. `N=5 SHARDS=4 capstone/run/run_cut.sh capstone/run/configs/b0.conf`.

VARIANT=B0
MODEL=gpt-oss-120b
PROVIDER=litellm
LITELLM_BASE_URL=http://localhost:8000/v1
TEMPERATURE=0.0
# low | medium | high; empty = server default. Sent as LITELLM_EXTRA_BODY.
REASONING_EFFORT=

# Sampling and sharding
N=2                    # --max-samples-per-domain
SHARDS=8               # parallel benchmark_runner processes per capability
CAPS="1 2 3 4"
SHARD_TIMEOUT_S=1200   # hard timeout per shard process
AGENT_TIMEOUT_SECONDS=300
RUNNER_ARGS=""         # extra benchmark_runner.py flags, e.g. "--top-k-tools 10"

# Paths (relative paths are resolved from the repo root)
RUN_ROOT=/scratch/runs
GT_ROOT=data/train
MCP_CONFIG=benchmark/mcp_connection_config.yaml
VENV=.venv
EXCLUDE_UUIDS=          # optional reference-wrong uuid list for the analysis step

# Judge (evaluator/judge.py reads JUDGE_ENDPOINT / JUDGE_MODEL)
JUDGE_BACKEND=groq
JUDGE_ENDPOINT=http://localhost:8000
JUDGE_MODEL=gpt-oss-120b
EVAL_PARALLEL=0        # 1 = run capability evaluators concurrently (not recommended)

# Tracing (capstone/observability); requires a running Phoenix collector
TRACING=0
PHOENIX_COLLECTOR_ENDPOINT=http://127.0.0.1:6006
PHOENIX_PROJECT_NAME=vakra-capstone

# Informational only: how vLLM was launched (recorded in config.json)
VLLM_FLAGS="--served-model-name openai/gpt-oss-120b gpt-oss-120b --tensor-parallel-size 1 --gpu-memory-utilization 0.90 --max-model-len 65536 --max-num-seqs 64 --max-num-batched-tokens 16384 --tool-call-parser openai --enable-auto-tool-choice"

ANALYZE=1              # run capstone.analysis summarize at the end
