# Session B runner config. NON-SECRET.
#
# This does not launch. B2_CONFIG points at b2_unfrozen.json, which refuses
# until every decision field is set and status is SET.
#
# Proposed recovery bounds, for comments only, not set below:
#   max tool calls 3, max LLM calls 4, timeout 300s,
#   skip when the resume prompt is over 65536 tokens,
#   control seed 20261119,
#   on reject / cap hit / error: keep the B0 answer and flag,
#   abstain only when the re-check is insufficient.
#
# N=0 so run_cut does not pass --max-samples-per-domain. The task manifest is
# the sample. TASK_SUBSET is the Q7 cap-hit list; leave it empty until that
# file exists. RECURSION_LIMIT empty keeps the LangGraph library default.

VARIANT=B2
VERIFIER_CONFIG=capstone/run/configs/b1_verifier.json
B2_CONFIG=capstone/run/configs/b2_unfrozen.json
TASK_MANIFEST=capstone/data/manifests/verified-common-414-membership.json
TASK_SUBSET=
RECURSION_LIMIT=

MODEL=gpt-oss-120b
PROVIDER=litellm
LITELLM_BASE_URL=http://localhost:8000/v1
TEMPERATURE=0.0
REASONING_EFFORT=

N=0
SHARDS=8
CAPS="1 2 3 4"
SHARD_TIMEOUT_S=1200
AGENT_TIMEOUT_SECONDS=300
RUNNER_ARGS=""

RUN_ROOT=/scratch/runs
GT_ROOT=data/train
MCP_CONFIG=benchmark/mcp_connection_config.yaml
VENV=.venv
EXCLUDE_UUIDS=

JUDGE_BACKEND=groq
JUDGE_ENDPOINT=http://localhost:8000
JUDGE_MODEL=gpt-oss-120b
EVAL_PARALLEL=0

TRACING=0
PHOENIX_COLLECTOR_ENDPOINT=http://127.0.0.1:6006
PHOENIX_PROJECT_NAME=vakra-capstone

VLLM_FLAGS="--served-model-name openai/gpt-oss-120b gpt-oss-120b --tensor-parallel-size 1 --gpu-memory-utilization 0.90 --max-model-len 65536 --max-num-seqs 64 --max-num-batched-tokens 16384 --tool-call-parser openai --enable-auto-tool-choice"

ANALYZE=1
